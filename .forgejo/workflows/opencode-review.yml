name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: bookworm
    steps:
      - uses: https://forgejo.softwarepatterns.com/actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: https://forgejo.softwarepatterns.com/softwarepatterns/forgejo-actions/opencode-forgejo@v1
        with:
          model: deepseek/deepseek-v4-pro
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
